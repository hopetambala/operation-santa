# Unit tests, Rust tests and the real-app E2E suite on macOS and Windows (PRD §14–15).
# Actions are pinned to commit SHAs and Node/Rust to exact versions, as in release.yml: caches written on main feed the
# signed release builds, so anything that runs here is part of what ships.
name: CI
env:
  NODE_VERSION: 24.14.1
  RUST_VERSION: 1.97.1
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: '${{ env.NODE_VERSION }}', cache: npm}
      - run: rustup toolchain install "$RUST_VERSION" --profile minimal && rustup default "$RUST_VERSION"
        shell: bash
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npm test
      - run: cargo test --workspace
      - run: npm run build
  e2e:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: '${{ env.NODE_VERSION }}', cache: npm}
      - run: rustup toolchain install "$RUST_VERSION" --profile minimal && rustup default "$RUST_VERSION"
        shell: bash
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: npm ci
      - run: npm run e2e:build
      - run: npm run e2e
        if: runner.os != 'Windows'
      # Windows logs every app start and exit code (e2e/watch-app-exits.ps1): a crash exits with an NTSTATUS such as
      # 0xC0000374, the harness's own stop with 0xFFFFFFFF. A crash becomes a warning on the run even when a retry passes.
      # The Application event log can't do this: these runners keep Windows Error Reporting stopped, so it stays empty.
      - name: npm run e2e (with app exit codes)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $log = "$env:GITHUB_WORKSPACE\e2e\.artifacts\app-exits.log"
          New-Item -ItemType Directory -Force (Split-Path $log) | Out-Null
          $watch = Start-Process pwsh -ArgumentList '-NoProfile','-File','e2e/watch-app-exits.ps1','-Log',$log -PassThru -WindowStyle Hidden
          try { npm run e2e; $code = $LASTEXITCODE } finally { Start-Sleep 1; Stop-Process -Id $watch.Id -Force -ErrorAction SilentlyContinue }
          Get-Content $log -ErrorAction SilentlyContinue
          Select-String -Path $log -Pattern 'code=0xC' -ErrorAction SilentlyContinue | ForEach-Object { "::warning title=The app crashed during E2E::$($_.Line)" }
          exit $code
      # Synthetic data only: season files, PDFs and screenshots from the fixture families.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: e2e-evidence-${{ matrix.os }}
          path: e2e/.artifacts/
          include-hidden-files: true
          retention-days: 14
