<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Dev build icon (tauri.dev.conf.json). Slate instead of green, with a hazard band, so it can't be mistaken for the real app at 32 px. -->
  <defs>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
    <pattern id="hazard" width="96" height="96" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="96" height="96" fill="#f2c230"/>
      <rect width="48" height="96" fill="#1b1d21"/>
    </pattern>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="#3a4049"/>
  <g transform="translate(100 100) scale(12.875)">
    <path d="M15 49c7-1 7-11 14-12s9-6 11-10" fill="none" stroke="#f4f1ea" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="0.01 6.4"/>
    <circle cx="15" cy="49" r="4" fill="#f4f1ea"/>
    <path d="M45 7l4.4 10.6L60 22l-10.6 4.4L45 37l-4.4-10.6L30 22l10.6-4.4z" fill="#c4a15a"/>
  </g>
  <g clip-path="url(#tile)">
    <rect x="100" y="700" width="824" height="224" fill="url(#hazard)"/>
  </g>
</svg>
